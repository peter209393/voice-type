[package]
name = "voice-type"
version = "0.1.0"
edition = "2021"

[features]
default = []
gtk-tray = ["dep:libappindicator"]

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
cpal = "0.15"
hound = "3.5"
serde_json = "1.0"
which = "6"
reqwest = { version = "0.12", features = ["multipart", "stream", "json"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
ksni = "0.2"
gtk = "0.18"
libappindicator = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5"
enigo = "0.3"
objc = "0.2"
core-graphics = "0.24"
